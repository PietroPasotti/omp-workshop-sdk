name: Bootstrap Major Track

# Runs daily and on demand. Detects when the latest upstream omp major exceeds
# the current default-branch track number, then creates the new track branch,
# updates the versioned files, creates the SDK store track, changes the
# default branch, and opens a PR that auto-merges to trigger the first
# upload — fully unattended.
#
# Every side effect below is idempotent: a run that fails partway (e.g. an
# expired store credential) leaves state that the NEXT run detects and
# resumes from, instead of silently reporting "nothing to do" forever.
#
# Prerequisites:
#   SDKCRAFT_STORE_TOKEN  — required; store authentication
#   ADMIN_TOKEN           — required; a fine-grained PAT with Contents +
#                           Pull requests write, and Administration:write.
#                           Commits authored with GITHUB_TOKEN don't
#                           re-trigger the pull_request "Build SDK" workflow
#                           (GitHub's recursion guard parks it at
#                           action_required), so the required "build / build"
#                           check never posts and auto-merge stays BLOCKED.
#                           ADMIN_TOKEN is also used to flip the default
#                           branch, which GITHUB_TOKEN cannot do.
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily (runs from the default branch)
  workflow_dispatch:

permissions:
  contents: write        # push setup branch, create refs
  pull-requests: write   # create PR, enable auto-merge

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_TOKEN }}
      - name: Detect version gap
        id: detect
        run: |
          set -euo pipefail

          # Highest major version published by upstream (any release, not just "Latest")
          LATEST_MAJOR=$(gh release list --repo can1357/oh-my-pi --limit 100 \
            --json tagName --jq \
            '[.[].tagName | select(test("^v[0-9]+\\.")) | ltrimstr("v") |
             split(".")[0] | tonumber] | max | tostring')

          # Default branch carries the current track number
          DEFAULT_BRANCH=$(gh repo view \
            --json defaultBranchRef --jq '.defaultBranchRef.name')
          CURRENT_MAJOR=$(echo "$DEFAULT_BRANCH" | cut -d/ -f2)

          # Most-recent stable release within the new major (releases are newest-first)
          LATEST_VERSION=$(gh release list --repo can1357/oh-my-pi --limit 100 \
            --json tagName,isPrerelease \
            --jq "[.[] | select(.isPrerelease==false) |
                  select(.tagName | startswith(\"v${LATEST_MAJOR}.\")) |
                  .tagName | ltrimstr(\"v\")] | .[0]")

          echo "latest_major=$LATEST_MAJOR"     >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_major=$CURRENT_MAJOR"   >> "$GITHUB_OUTPUT"

          if [ "$LATEST_MAJOR" -gt "$CURRENT_MAJOR" ]; then
            echo "needs_bootstrap=true"  >> "$GITHUB_OUTPUT"
          else
            echo "needs_bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap track/${{ steps.detect.outputs.latest_major }}
        if: steps.detect.outputs.needs_bootstrap == 'true'
        env:
          OLD_MAJOR: ${{ steps.detect.outputs.current_major }}
          NEW_MAJOR: ${{ steps.detect.outputs.latest_major }}
          NEW_VERSION: ${{ steps.detect.outputs.latest_version }}
          SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_TOKEN }}
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          # ── 1. track/N branch (idempotent) ──────────────────────────────
          if git ls-remote --exit-code origin "refs/heads/track/${NEW_MAJOR}" \
              > /dev/null 2>&1; then
            echo "[1/4] track/${NEW_MAJOR} already exists."
          else
            TRACK_SHA=$(git rev-parse HEAD)
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -X POST -f ref="refs/heads/track/${NEW_MAJOR}" -f sha="${TRACK_SHA}"
            echo "[1/4] Created track/${NEW_MAJOR} at ${TRACK_SHA}."
          fi
          # Local remote-tracking ref for track/N isn't fetched by the initial
          # checkout (only the default branch is); step 2 needs it whether the
          # branch was just created above or already existed from a prior run.
          git fetch origin \
            "refs/heads/track/${NEW_MAJOR}:refs/remotes/origin/track/${NEW_MAJOR}"

          # ── 2. Setup PR: bump VERSION + renovate.json (idempotent) ──────
          # "Already merged" is detected from the VERSION file on track/N
          # itself, not from local state — safe to re-run after any failure
          # in a later stage without opening a duplicate PR.
          REMOTE_VERSION=$(git show "origin/track/${NEW_MAJOR}:VERSION" 2>/dev/null || echo "")
          OPEN_PR=$(gh pr list --head "setup/track-${NEW_MAJOR}" \
            --base "track/${NEW_MAJOR}" --state open \
            --json number --jq '.[0].number // empty')
          if printf '%s' "$REMOTE_VERSION" | grep -q "^${NEW_MAJOR}\."; then
            echo "[2/4] track/${NEW_MAJOR} VERSION already ${REMOTE_VERSION} — setup already merged."
          elif [ -n "$OPEN_PR" ]; then
            echo "[2/4] Setup PR #${OPEN_PR} already open — auto-merge will land it."
          else
            git checkout -B "setup/track-${NEW_MAJOR}" "origin/track/${NEW_MAJOR}"

            # ── VERSION ─────────────────────────────────────────────────
            echo "$NEW_VERSION" > VERSION

            # ── renovate.json: baseBranchPatterns, matchBaseBranches, allowedVersions
            # The allowedVersions string in the parsed JSON is /^<N>\./ (the JSON
            # encoding doubles the backslash to /^<N>\\./). jq --arg passes the
            # decoded value, so we write the single-backslash form here.
            jq --arg old "track/${OLD_MAJOR}" \
               --arg new "track/${NEW_MAJOR}" \
               --arg oldv "/^${OLD_MAJOR}\./" \
               --arg newv "/^${NEW_MAJOR}\./" \
              '.baseBranchPatterns |=
                 map(if . == $old then $new else . end) |
               .packageRules |= map(
                 .matchBaseBranches |=
                   map(if . == $old then $new else . end) |
                 if .allowedVersions == $oldv
                   then .allowedVersions = $newv
                   else .
                 end
               )' renovate.json > renovate.json.tmp \
              && mv renovate.json.tmp renovate.json

            git add VERSION renovate.json
            git commit -m "chore: configure ${NEW_MAJOR}/edge track"
            git push origin "setup/track-${NEW_MAJOR}"

            # build.yml uses branches: ["track/*"] so it fires on this PR.
            # Merging (below) is done with ADMIN_TOKEN, a real user PAT, so
            # unlike GITHUB_TOKEN it DOES trigger push-based workflows —
            # upload.yml fires on its own once this lands, no manual
            # poll-and-dispatch needed.
            PR_URL=$(gh pr create \
              --base  "track/${NEW_MAJOR}" \
              --head  "setup/track-${NEW_MAJOR}" \
              --title "chore: configure ${NEW_MAJOR}/edge track" \
              --body  "Automated bootstrap: bumps VERSION to ${NEW_VERSION} and \
            updates renovate.json for the ${NEW_MAJOR}/edge track.")
            gh pr merge --auto --merge --delete-branch "${PR_URL}"
            echo "[2/4] Opened ${PR_URL} with auto-merge enabled."
          fi

          # ── 3. Store track (idempotent: tolerate "already exists") ──────
          for attempt in 1 2 3; do
            sudo snap install sdkcraft --edge --classic && break
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          if OUTPUT=$(sdkcraft create-track omp --track "${NEW_MAJOR}" 2>&1); then
            echo "$OUTPUT"
            echo "[3/4] Store track ${NEW_MAJOR} ready."
          elif printf '%s' "$OUTPUT" | grep -qi "already exist"; then
            echo "[3/4] Store track ${NEW_MAJOR} already exists."
          else
            echo "$OUTPUT" >&2
            echo "::error::sdkcraft create-track failed — see log above." \
                 "Steps 1-2 above already landed and won't be repeated;" \
                 "the next scheduled run retries from here."
            exit 1
          fi

          # ── 4. Default branch (idempotent) ───────────────────────────────
          CURRENT_DEFAULT=$(gh repo view --json defaultBranchRef \
            --jq '.defaultBranchRef.name')
          if [ "$CURRENT_DEFAULT" = "track/${NEW_MAJOR}" ]; then
            echo "[4/4] Default branch already track/${NEW_MAJOR}."
          else
            gh api "repos/${GITHUB_REPOSITORY}" \
              -X PATCH -f "default_branch=track/${NEW_MAJOR}"
            echo "[4/4] Default branch changed to track/${NEW_MAJOR}."
          fi
