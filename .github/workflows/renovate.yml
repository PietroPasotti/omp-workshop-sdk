name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1-5"
  workflow_dispatch:

jobs:
  renovate:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: canonical/sdkcraft-actions/.github/workflows/renovate.yml@main
    secrets:
      # Renovate must author its PRs as a real PAT, not GITHUB_TOKEN. Commits made
      # with GITHUB_TOKEN do not re-trigger the pull_request "Build SDK" workflow
      # (GitHub's recursion guard parks it at action_required), so the required
      # `build / build` check never posts and the enabled auto-merge stays BLOCKED.
      # ADMIN_TOKEN is a user-owned fine-grained PAT (Contents + Pull requests write)
      # whose commits trigger the check normally, letting auto-merge complete.
      token: ${{ secrets.ADMIN_TOKEN }}
