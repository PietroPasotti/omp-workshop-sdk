name: omp
adopt-info: omp
summary: Oh My Pi — AI coding agent for the terminal
description: |
  This SDK provides omp, the oh-my-pi AI coding agent. It ships with
  hash-anchored edits, LSP integration, DAP debugging, persistent Python
  and JS eval kernels, first-class subagents, and 40+ AI provider
  connections out of the box. Configuration, sessions, memory (Hindsight),
  and plugins are persisted across workshop updates.
license: MIT
website: https://github.com/PietroPasotti/omp-workshop-sdk
platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:
  ubuntu@26.04:amd64:
  ubuntu@22.04:arm64:
    build-on: [ubuntu@22.04:amd64]
    build-for: [ubuntu@22.04:arm64]
  ubuntu@24.04:arm64:
    build-on: [ubuntu@24.04:amd64]
    build-for: [ubuntu@24.04:arm64]
  ubuntu@26.04:arm64:
    build-on: [ubuntu@26.04:amd64]
    build-for: [ubuntu@26.04:arm64]

plugs:
  omp-home:
    interface: mount
    workshop-target: /home/workshop/.omp

parts:
  omp:
    plugin: dump
    source: .
    source-type: local
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ASSET=omp-linux-x64 ;;
        arm64) ASSET=omp-linux-arm64 ;;
        *) echo "unsupported arch: $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac
      curl -fLO "https://github.com/can1357/oh-my-pi/releases/download/v${VERSION}/${ASSET}"
      mv "$ASSET" omp
      chmod +x omp
    organize:
      omp: bin/omp
