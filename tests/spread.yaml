project: omp

path: /home/ubuntu/project

prepare: |
  sudo snap wait system seed.loaded
  sudo snap install lxd --channel=6/stable
  sudo lxd waitready --timeout=180
  sudo lxd init --auto
  sudo snap install workshop --classic
  # sdkcraft test stages the built SDK into the workshop try area
  # automatically before invoking spread; no manual copy needed here.

backends:
  lxd:
    systems:
      - ubuntu-24.04:
          username: ubuntu
          vm: true

suites:
  main/:
    summary: Smoke-test the omp SDK inside workshops with different bases
    environment:
      BASE/jammy: ubuntu@22.04
      BASE/noble: ubuntu@24.04
